<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetHub | Reset Password</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="flex flex-col min-h-screen">
  <nav class="nav">
    <div class="nav-container">
      <a href="../../index.html" class="logo">
        <img src="../../assets/images/paw.png" alt="PetHub">
        <h1>PetHub</h1>
      </a>
      <ul class="nav-links">
        <li><a href="../../index.html">Home</a></li>
        <li><a href="../public/about.html">About</a></li>
        <li><a href="../public/services.html">Services</a></li>
        <li><a href="../public/contact.html">Contact</a></li>
      </ul>
    </div>
  </nav>

  <main class="flex-grow">
    <section class="auth-section">
      <div class="auth-card">
        <h2>Reset Your Password</h2>
        <p id="resetIntro" class="text-gray-500">Enter the email you use for PetHub and we'll send you a 6-digit reset code.</p>

        <form id="requestResetForm" class="space-y-5">
          <div class="form-group">
            <label for="requestEmail" class="flex items-center gap-2 font-semibold text-gray-700 mb-2">
              <i class="ri-mail-line text-orange-500" aria-hidden="true"></i>
              Email
            </label>
            <input type="email" id="requestEmail" placeholder="Enter your email" autocomplete="email" required
              class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-orange-500 focus:ring-2 focus:ring-orange-100 focus:outline-none transition-all duration-200 bg-white hover:border-orange-300">
          </div>

          <div id="requestMessageContainer" class="min-h-10 text-sm font-medium rounded-lg transition-all duration-200"></div>

          <button type="submit" class="w-full py-3 bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 active:from-orange-700 active:to-orange-800 text-white font-semibold rounded-lg transition-all duration-200 cursor-pointer border-none transform hover:scale-105 active:scale-95 shadow-lg hover:shadow-xl">Send Reset Code</button>
        </form>

        <div id="haveCodeWrapper" class="mt-4 text-center">
          <button type="button" id="haveCodeButton" class="text-sm text-orange-600 hover:underline">Already have a code?</button>
        </div>

        <form id="resetPasswordForm" class="space-y-5 hidden">
          <div class="form-group">
            <label for="resetEmail" class="flex items-center gap-2 font-semibold text-gray-700 mb-2">
              <i class="ri-mail-line text-orange-500" aria-hidden="true"></i>
              Email
            </label>
            <input type="email" id="resetEmail" placeholder="Enter your email" autocomplete="email" required
              class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-orange-500 focus:ring-2 focus:ring-orange-100 focus:outline-none transition-all duration-200 bg-white hover:border-orange-300">
          </div>

          <div class="form-group">
            <label for="resetCode" class="flex items-center gap-2 font-semibold text-gray-700 mb-2">
              <i class="ri-shield-keyhole-line text-orange-500" aria-hidden="true"></i>
              Reset Code
            </label>
            <input type="text" id="resetCode" placeholder="Enter 6-digit code" maxlength="6" inputmode="numeric" autocomplete="one-time-code" required
              class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-orange-500 focus:ring-2 focus:ring-orange-100 focus:outline-none transition-all duration-200 bg-white hover:border-orange-300">
          </div>

          <div class="form-group" id="passwordGroup">
            <label for="password" class="flex items-center gap-2 font-semibold text-gray-700 mb-2">
              <i class="ri-lock-line text-orange-500" aria-hidden="true"></i>
              New Password
            </label>
            <div class="relative">
              <input type="password" id="password" placeholder="Create a new password" autocomplete="new-password" required
                class="w-full px-4 py-3 pr-12 border-2 border-gray-200 rounded-lg focus:border-orange-500 focus:ring-2 focus:ring-orange-100 focus:outline-none transition-all duration-200 bg-white hover:border-orange-300">
              <button type="button" id="togglePassword" aria-label="Show password" aria-pressed="false" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-orange-500 transition-colors duration-150">
                <i class="ri-eye-line"></i>
              </button>
            </div>
            <p class="mt-2 text-sm text-gray-500">Use at least 8 characters.</p>
          </div>

          <div class="form-group" id="confirmPasswordGroup">
            <label for="confirmPassword" class="flex items-center gap-2 font-semibold text-gray-700 mb-2">
              <i class="ri-shield-check-line text-orange-500" aria-hidden="true"></i>
              Confirm New Password
            </label>
            <div class="relative">
              <input type="password" id="confirmPassword" placeholder="Confirm your new password" autocomplete="new-password" required
                class="w-full px-4 py-3 pr-12 border-2 border-gray-200 rounded-lg focus:border-orange-500 focus:ring-2 focus:ring-orange-100 focus:outline-none transition-all duration-200 bg-white hover:border-orange-300">
              <button type="button" id="togglePasswordConfirm" aria-label="Show password confirmation" aria-pressed="false" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-orange-500 transition-colors duration-150">
                <i class="ri-eye-line"></i>
              </button>
            </div>
          </div>

          <div id="formMessageContainer" class="min-h-10 text-sm font-medium rounded-lg transition-all duration-200"></div>

          <button type="submit" class="w-full py-3 bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 active:from-orange-700 active:to-orange-800 text-white font-semibold rounded-lg transition-all duration-200 cursor-pointer border-none transform hover:scale-105 active:scale-95 shadow-lg hover:shadow-xl">Reset Password</button>
        </form>

        <div id="resendResetCodeWrapper" class="mt-4 text-center hidden">
          <button type="button" id="resendResetCodeButton" class="text-sm text-orange-600 hover:underline">Resend code</button>
        </div>

        <p class="auth-link mt-4">
          Remembered your password?
          <a href="login.html">Back to Login</a>
        </p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 PetHub. Caring for Your Pet's Health. All rights reserved.</p>
  </footer>

  <button id="darkModeToggle" class="dark-mode-toggle" title="Toggle Dark Mode">
    <i class="ri-moon-line"></i>
  </button>

  <script src="../../js/core/api.js"></script>
  <script src="../../js/core/utils.js"></script>
  <script src="../../js/core/storage.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/core/auth.js"></script>
  <script src="../../js/core/password-reset.js"></script>
</body>
</html>
